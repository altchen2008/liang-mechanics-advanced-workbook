function escapeText(text) {
  return String(text).replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
}

const mathCache = new Map();
function renderText(text) {
  let html = "";
  let position = 0;
  for (const match of text.matchAll(/\\\((.*?)\\\)|\\\[(.*?)\\\]/g)) {
    html += escapeText(text.slice(position, match.index));
    const display = match[2] !== undefined;
    const tex = display ? match[2] : match[1];
    let rendered = mathCache.get(match[0]);
    if (!rendered) {
      rendered = katex.renderToString(tex, {
        output: "mathml",
        displayMode: display,
        strict: "error",
        throwOnError: true,
      });
      mathCache.set(match[0], rendered);
    }
    const modifier = display ? " formula-block" : "";
    const focus = display ? ' tabindex="0"' : "";
    html += `<span class="formula${modifier}"${focus}>${rendered}</span>`;
    position = match.index + match[0].length;
  }
  return html + escapeText(text.slice(position));
}

      points = [[86,121],[113,87],[172,62],[258,44]];
      break;
    }
    case "spring": case "coupled":
      ground(47,312,117);line(53,56,53,116);
      spring(53,88,type === "coupled" ? 67 : 111);rect(type === "coupled" ? 120 : 164,73,35,31);
      if (type === "coupled") {spring(155,88,67);rect(222,73,34,31);spring(256,88,49);line(305,56,305,116);}
      else {arrow(199,88,271,88);dash(167,32,167,136);}
      points = type === "coupled" ? [[72,65],[139,58],[187,70],[239,58],[291,69]] : [[106,65],[184,60],[264,73],[166,136]];
      break;
    case "well": case "osc":
      arrow(47,121,322,121,ink); arrow(62,137,62,20,ink);
      if (type === "well") {path("M69 25Q109 161 171 69Q192 36 211 69Q259 156 307 25");dash(87,67,288,67);points=[[126,118],[191,43],[257,118],[279,62]];}
      else {
        dash(63,72,312,72);
        const response = id === "48-3" ? t => -(1 + 7*t) * Math.exp(-7*t) :
          t => -Math.cos((id === "49-5" ? 2 : 3.2)* 2*Math.PI*t) * (id === "48-2" ? Math.exp(-2.3*t) : 0.83);
        wave(64,72,242,41,3,response);
        if (id === "48-2") wave(64,72,242,41,0,t=>-Math.exp(-2.3*t),pale);
        points=[[84,27],[155,42],[307,138],[245,65]];
      }
      break;
    case "wall":
      if (id === "45-5") {
        ground(75,311,133);line(76,28,76,133);line(76,44,257,131);

      } else {
        ground(58,300,130);line(104,23,104,130);arrow(207,91,111,57);

        points=[[84,28],[183,91],[217,40],[83,115]];

      break;
    case "pend": case "pend2": case "gyro": case "twist":
      if (type === "pend" || type === "pend2") {
        ground(79,273,32);
        const inverted=id === "42-3";
        const yPivot=inverted?129:32;
        const yMass=inverted?50:112;
        line(149,yPivot,191,yMass);
        dash(149,yPivot,149,yMass);circle(149,yPivot,4,ink);circle(191,yMass,12,fill);
        if (type === "pend2") {line(223,32,256,112);circle(223,32,4,ink);circle(256,112,12,fill);spring(202,112,43);}
        else if (!inverted) {oval(149,113,18,14,pale);arrow(69,112,130,112);}
        points=[[139,yPivot+12],[201,yMass-20],[103,yMass-4],[226,yMass+13]];
      } else if (type === "gyro") {
        path("M145 134h68m-59 0 25-20 25 20",ink,fill);
        dash(179,115,179,18);arrow(179,115,260,29,ink);
        oval(220,70,41,12,ink,42);oval(178,43,50,12,pale);
        circle(203,90,5,fill);arrow(203,90,203,123);
        points=[[164,114],[207,86],[192,48],[164,22],[269,35]];
      } else {
        circle(175,38,13,fill);path("M175 51V99m0 0-24 37m24-37 23 37m-23-71-38 10m38-10 36-43");
        dash(175,57,175,136);arrow(116,81,233,81,ink);arrow(175,93,175,20,ink);
        oval(175,83,60,22,pale);circle(175,81,5,hot);
        points=[[243,82],[187,23],[157,93],[213,34]];
      }
      break;
    case "beam": case "truss": case "plate":
      if (type === "truss") {
        path("M67 115 172 36 279 115Z",ink,fill);arrow(172,17,172,33);path("M67 115 55 133h24ZM279 115l-10 15h20Z");
        points=[[51,145],[298,145],[191,34],[172,132]];
      } else if (type === "plate") {
        rect(83,52,171,65);
        if (id === "40-2") circle(209,82,19,"#f2f7fd");
        else {circle(170,82,4,ink);arrow(48,65,81,65);}
        if (id === "42-5") ground(62,275,118);
        points=[[92,38],[209,82],[279,65],[75,132]];
      } else {
        rect(53,81,253,13);path("M65 94 54 114h22ZM288 94l-11 20h22Z");
        if (id === "41-3") {arrow(114,57,114,79);arrow(239,79,239,35);}
        else if (id === "42-1") {arrow(143,30,143,78);arrow(238,44,238,78);arrow(305,81,254,25);}
        else {arrow(139,41,139,79);arrow(235,41,235,79);}
        circle(175,87,3,ink);
        points=[[53,132],[137,29],[233,29],[288,131]];
      }
      break;
    case "pulley":
      circle(172,53,34,fill);circle(172,53,4,ink);line(138,53,138,103);line(206,53,206,116);
      rect(125,104,26,24);rect(191,116,30,25);
      points=[[113,115],[237,123],[202,32],[164,43]];
      break;
    case "wave": case "standing": case "packet": case "spectrum": case "phase": case "lissa":
      arrow(49,122,320,122,ink);arrow(56,131,56,22,ink);dash(57,78,314,78);
      if (type === "spectrum") {
        [65,154,239].forEach((x,i)=>{line(x,122,x,122-[28,79,53][i]);circle(x,122-[28,79,53][i],3,hot);});
        points=[[75,87],[165,38],[251,65],[285,138]];
      } else if (type === "phase") {
        arrow(92,109,231,109,ink);arrow(231,109,231,41,ink);arrow(92,109,231,41);
        points=[[153,125],[250,76],[211,92],[165,65]];
      } else if (type === "lissa") {
        let d = "";
        for (let i = 0; i <= 100; i++) {const t=i/100*2*Math.PI;d+=`${i?"L":"M"}${(177+110*Math.cos(t)).toFixed(1)} ${(77+42*Math.sin(2*t)).toFixed(1)}`;}
        path(d);circle(177,77,4,hot);
        points=[[286,76],[169,27],[192,78],[89,99]];
      } else {
        const shape = type === "packet" ? t=>Math.sin(16*Math.PI*t)*Math.sin(Math.PI*t)**2 :
          type === "standing" ? t=>Math.sin((id === "52-2" ? 2.5 : 4)*Math.PI*t) :
          id === "51-1" ? t=>t<0.53?-Math.sin(Math.PI*t/0.53):0 : undefined;
        wave(59,78,246,35,2.5,shape);
        if (type === "standing" || type === "packet") wave(59,78,246,35,0,t=>-(shape(t) || 0),pale);
        arrow(220,26,299,26);
        points=[[48,44],[141,29],[269,42],[301,138]];
      }
      break;
    case "interface": case "slab":
      if (id === "51-2") {
        rect(59,37,241,87,"#e7f0f9",pale);
        rect(60,50,11,60,fill);rect(289,50,11,60,fill);
        arrow(77,59,283,59,ink);arrow(77,99,283,99);
        wave(99,59,90,11,3,undefined,ink);wave(99,99,112,12,3,undefined,hot);
        points=[[51,36],[306,36],[231,48],[232,109]];
        break;
      }
      if (id === "52-1") {
        dash(40,82,318,82);line(175,48,175,117,pale);circle(175,82,4,ink);
        wave(50,82,125,24,1.15);wave(175,82,135,14,2.3,undefined,hot);
        arrow(60,34,136,34,ink);arrow(139,114,70,114);arrow(194,34,265,34,ink);
        points=[[50,55],[307,44],[175,123],[146,121]];
        break;
      }
      rect(42,79,277,57,fill,pale);line(42,79,319,79);
      dash(179,19,179,140);arrow(110,31,178,78);arrow(179,79,id === "53-4" ? 248 : 220,id === "53-4" ? 29 : 126,ink);
      points=[[70,52],[269,103],[161,56],[237,119]];
      break;
    case "slit": case "interference": case "holo":
      if (type === "holo") {
        line(232,29,232,131);for(let j=37;j<=127;j+=8)line(224,j,239,j,pale);
        arrow(61,111,230,79);arrow(58,79,230,79,ink);
        if (id === "54-5") {arrow(235,79,302,39);arrow(235,79,302,119);arrow(235,79,302,79,ink)}
        points=[[221,23],[72,66],[93,107],[264,95]];
      } else {
        line(291,25,291,132);
        if (type === "slit") {line(103,25,103,55);line(103,69,103,92);line(103,105,103,132);}
        circle(104,62,4,ink);circle(104,98,4,ink);
        line(104,62,289,57);line(104,98,289,57);
        dash(106,80,291,80);circle(289,57,5,hot);
        points=[[83,56],[83,107],[204,81],[309,59]];
      }
      break;
    case "wavefront": case "doppler":
      if (type === "wavefront" && id === "53-1") {
        for (let j=0;j<5;j++) line(37+j*46,45,137+j*46,120,pale);
        arrow(130,115,196,27);
        arrow(48,126,99,126,ink);
        points=[[236,113],[204,27],[156,54],[81,140]];
      } else {
        for (let j=22;j<=100;j+=18) oval(142,77,j,j*0.60,pale);
        circle(142,77,6,fill);arrow(148,77,292,77);circle(281,77,7,ink);
        if (type === "doppler") arrow(298,53,256,53,ink);
      }
      if (!points.length) points=[[142,96],[183,36],[276,94],[302,51]];
      break;
    default:
      throw new Error(`未知示意图类型 ${type}`);
  }

  labels.forEach((label, index) => {
    const point = points[index];
    if (!point) return;
    const [x,y] = point;
    circle(x,y,7.2,"#fff","#9c6b40");
    out.push(`<text x="${x}" y="${y+2.9}" fill="${hot}" stroke="none" font-family="system-ui" font-size="8.4" font-weight="750" text-anchor="middle">${index+1}</text>`);
  });
  const marker = (kind,color) => `<marker id="arrow-${kind}-${id}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="${color}"/></marker>`;
  const key = labels.map((label, index) => `<span class="figure-label"><b>${index+1}</b><span>${renderText(label)}</span></span>`).join("");
  return `<figure><svg viewBox="0 0 360 153" role="img" aria-label="${escapeText(title + "示意图")}"><defs>${marker("hot",hot)}${marker("ink",ink)}</defs><g stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">${out.join("")}</g></svg><figcaption>${key}</figcaption></figure>`;
}

const sections = chapters.flatMap(chapter => chapter.sections.map(section => ({ ...section, chapter })));
const byNumber = new Map(sections.map(section => [section.number, section]));
const navigation = document.querySelector("#navigation");
const sheet = document.querySelector("#sheet");
const search = document.querySelector("#search");
const sidebar = document.querySelector("#sidebar");
const menu = document.querySelector("#menu");
const doneCount = document.querySelector("#total-done");
const storageKey = "liang-mechanics-advanced-workbook:progress:v1";
const validIds = new Set(sections.flatMap(section => section.problems.map((_, i) => `${section.number}-${i+1}`)));
let done = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
  if (Array.isArray(saved)) done = new Set(saved.filter(id => validIds.has(id)));
} catch {
  // The exercises remain usable if storage is unavailable.
}

navigation.innerHTML = chapters.map(chapter => `
  <details class="chapter-nav" data-chapter="${chapter.number}">
    <summary>第${"四五六七"[chapter.number-4]}章　${escapeText(chapter.title)}</summary>
    <nav aria-label="第${chapter.number}章节次">
      ${chapter.sections.map(section => `<a class="section-link" href="#s${section.number}"><span>§${section.number}</span><span>${escapeText(section.title)}</span></a>`).join("")}
    </nav>
  </details>`).join("");

function readRoute() {
  const match = /^#s(\d+)(?:-p([1-5]))?$/.exec(location.hash);
  return { section: byNumber.get(Number(match?.[1])) ?? sections[0], problem: Number(match?.[2]) || null };
}

function renderProblem(section, index, open = false) {
  const problem = section.problems[index];
  const [title, topics, , , statement, steps] = problem;
  const id = `${section.number}-${index+1}`;
  const finished = done.has(id);
  return `
    <details class="exercise" id="p${id}"${open ? " open" : ""}>
      <summary>
        <span class="number">${id}</span>
        <div><h3>${escapeText(title)}<span class="checkmark"${finished ? "" : " hidden"}>已完成</span></h3><span class="topics">${escapeText(topics)}</span></div>
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="problem-body">
        <div class="problem-grid">
          <div><p class="problem-meta">题目</p><p class="statement">${renderText(statement)}</p></div>
          ${draw(problem,id)}
        </div>
        <details class="answer">
          <summary>参考解答</summary>
          <ol>${steps.map(step => `<li>${renderText(step)}</li>`).join("")}</ol>
        </details>
        <div class="actions"><button class="done" type="button" data-id="${id}" aria-pressed="${finished}">${finished ? "取消完成标记" : "标记完成"}</button></div>
      </div>
    </details>`;
}

function updateNavigation(section, searching) {
  navigation.querySelectorAll(".section-link").forEach(link => {
    if (!searching && link.hash === `#s${section.number}`) {
      link.setAttribute("aria-current","location");
      link.closest("details").open = true;
    } else {
      link.removeAttribute("aria-current");
    }
  });
  doneCount.textContent = String(done.size);
}

function render() {
  const { section, problem } = readRoute();
  const query = search.value.trim().toLocaleLowerCase();
  updateNavigation(section, Boolean(query));

  if (query) {
    const words = query.split(/\s+/).filter(Boolean);
    const results = sections.flatMap(entry => entry.problems.flatMap((item, index) => {
      const searchable = [entry.number, `${entry.number}-${index+1}`, entry.title, entry.chapter.title, item[0], item[1], item[6]].join(" ").toLocaleLowerCase();
      return words.every(word => searchable.includes(word)) ? [{ entry, index }] : [];
    }));
    sheet.innerHTML = `
      <header class="section-head"><h2>搜索结果</h2><p role="status">找到 ${results.length} 道题</p></header>
      ${results.length
        ? results.map(({ entry,index }) => `<p class="result-section">§${entry.number} ${escapeText(entry.title)}</p>${renderProblem(entry,index)}`).join("")
        : '<p class="empty">没有匹配的题目。可以试试节号或知识点名称。</p>'}`;
    return;
  }

  const at = sections.indexOf(section);
  const prev = sections[at-1];
  const next = sections[at+1];
  sheet.innerHTML = `
    <header class="section-head">
      <p>第${"四五六七"[section.chapter.number-4]}章　${escapeText(section.chapter.title)}　·　教材第 ${section.page} 页起</p>
      <h2>§${section.number}　${escapeText(section.title)}</h2>
      <ul class="coverage" aria-label="知识点">${section.coverage.map(tag => `<li>${escapeText(tag)}</li>`).join("")}</ul>
    </header>
    ${section.problems.map((_,i) => renderProblem(section,i,i === (problem ?? 1)-1)).join("")}
    <nav class="pagination" aria-label="前后节次">
      ${prev ? `<a href="#s${prev.number}">← §${prev.number}　${escapeText(prev.title)}</a>` : "<span></span>"}
      ${next ? `<a href="#s${next.number}">§${next.number}　${escapeText(next.title)} →</a>` : ""}
    </nav>`;
}

function navigateToSection() {
  search.value = "";
  render();
  const { section, problem } = readRoute();
  const target = problem ? document.getElementById(`p${section.number}-${problem}`) : sheet;
  target?.scrollIntoView({block:"start"});
}
function closeMobileMenu() {
  sidebar.dataset.open = "false";
  menu.setAttribute("aria-expanded","false");
}

search.addEventListener("input", render);
menu.addEventListener("click", () => {
  const open = sidebar.dataset.open !== "true";
  sidebar.dataset.open = String(open);
  menu.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", event => {
  const link = event.target.closest('a[href^="#s"]');
  if (!link || !/^#s\d+$/.test(link.hash) || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  if (location.hash !== link.hash) history.pushState(null,"",link.hash);
  closeMobileMenu();
  navigateToSection();
});
sheet.addEventListener("click", event => {
  const button = event.target.closest("button[data-id]");
  if (!button) return;
  const id = button.dataset.id;
  if (done.has(id)) done.delete(id);
  else done.add(id);
  try { localStorage.setItem(storageKey,JSON.stringify([...done])); } catch { /* In-memory state still works. */ }
  const finished = done.has(id);
  button.setAttribute("aria-pressed",String(finished));
  button.textContent = finished ? "取消完成标记" : "标记完成";
  button.closest(".exercise").querySelector(".checkmark").hidden = !finished;
  doneCount.textContent = String(done.size);
});
window.addEventListener("hashchange", navigateToSection);
render();
if (/^#s\d+/.test(location.hash)) requestAnimationFrame(() => {
  const { section, problem } = readRoute();
  (problem ? document.getElementById(`p${section.number}-${problem}`) : sheet)?.scrollIntoView();
});

</script>
</body>
</html>
